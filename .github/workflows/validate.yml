name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install narrow validation dependencies
        run: python3 -m pip install "aiohttp>=3.11,<4" pytest ruff
      - name: Validate repository invariants
        run: python3 scripts/validate.py
      - name: Compile integration
        run: python3 -m compileall -q custom_components/cosmo
      - name: Run test suite
        run: python3 -m pytest -q
      - name: Run optimized-mode import and behavior suite
        run: python3 -OO -m pytest -q
      - name: Lint
        run: ruff check .
      - name: Check patch whitespace
        run: git diff --check
